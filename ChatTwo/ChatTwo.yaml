name: Chat 2
author: Infi, Anna
punchline: ♪ 全新的聊天體驗，更好用的聊天視窗 ♪
description: |-
  Chat 2 是以插件形式重新打造的遊戲聊天視窗。
  支援功能：

  - 無限數量的標籤頁
  - 可指定固定發言頻道的標籤頁
  - 更靈活的訊息篩選
  - 自訂 RGB 頻道顏色
  - 自由調整字體大小
  - 側邊欄標籤頁
  - 未讀訊息計數
  - 表情圖示
  - 截圖模式（隱藏角色名稱）
repo_url: https://github.com/cycleapple/ChatTwo
accepts_feedback: true
tags:
  - Social
  - UI
  - Chat
  - Replacement
changelog:  |-
  **繁中字型修正**
  - 新增台灣繁中字形載入範圍
  - 補入 CJK 標點及全形／半形符號
  - 修正部分日文字形範圍外的中文字無法顯示

