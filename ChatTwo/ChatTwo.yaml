name: Chat 2
author: Infi, Anna
punchline: ♪ 全新的聊天體驗，更好用的聊天視窗 ♪
description: |-
  Chat 2 是以插件形式重新打造的遊戲聊天視窗。
  支援功能：

  - 無限數量的標籤頁
  - 可指定固定發言頻道的標籤頁
  - 更靈活的訊息篩選
  - 自訂 RGB 頻道顏色
  - 自由調整字體大小
  - 側邊欄標籤頁
  - 未讀訊息計數
  - 表情圖示
  - 截圖模式（隱藏角色名稱）
repo_url: https://github.com/cycleapple/ChatTwo
accepts_feedback: true
tags:
  - Social
  - UI
  - Chat
  - Replacement
changelog:  |-
  **繁體中文第二輪**
  - 完成資料庫瀏覽器、進階資料庫操作與搜尋介面的繁中化
  - 完成內建 Web 聊天介面的登入、標籤頁、訊息輸入與錯誤頁面繁中化
  - 補齊插件清單的繁體中文說明

  **Web 介面安全提醒**
  - 僅供區域網路內使用，請勿將連接埠轉送至網際網路
  - 請勿將驗證碼交給其他人
  - Web 介面僅會連接第一個遊戲客戶端

